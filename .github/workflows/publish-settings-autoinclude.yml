name: publish-settings-autoinclude
on:
  push:
    branches:
      - main
      - develop
    paths:
      - plugin-settings-autoinclude/**
      - .github/workflows/publish-settings-autoinclude.yml
      - build.gradle.kts
      - settings.gradle.kts
      - gradle/libs.versions.toml
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: gradle
      - name: Setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: Deploy Buildlogic Settings Auto-Include Plugin
        run: ./gradlew :plugin-settings-autoinclude:publishGprPublicationToGithubPackagesRepository --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
